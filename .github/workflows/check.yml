name: Verify
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install jsonschema
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
